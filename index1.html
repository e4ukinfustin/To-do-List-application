<!DOCTYPE HTML>
<HTML> 
<head>
    <title>
        To do list app
    </title>
</head>
<body>
    <h1>My To-do List</h1>
    <input id="task_recipiant" type="text" placeholder="Task goes here">
    <button id="confirm"> Confirm Task</button>
    <ul id="task_list"></ul>
    <button id="remove">Click here to activate remove a task</button>
<script>
const button = document.querySelector("#confirm")
const input = document.querySelector("#task_recipiant")
const task_list = document.querySelector("#task_list")
const remover = document.querySelector("#remove")
remover.addEventListener("Click", () => {
    task_list.replaceChildren();
})
button.addEventListener("click", () => {
    const task = input.value;
    console.log(task)
    if(task !== ""){
        const list_item = document.createElement("li")
        list_item.textContent = task
        task_list.appendChild(list_item)
    }
})

</script>
</body>
</HTML>
