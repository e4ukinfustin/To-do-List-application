<!DOCTYPE HTML>
<HTML> 
<head>
    <title>
        To do list app
    </title>
    <style>
        li button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>My To-do List</h1>
    <input id="task_recipiant" type="text" placeholder="Task goes here">
    <button id="confirm"> Confirm Task</button>
    <ul id="task_list"></ul>
<script>
const button = document.querySelector("#confirm")
const input = document.querySelector("#task_recipiant")
const task_list = document.querySelector("#task_list")
button.addEventListener("click", () => {

    const task = input.value;
    console.log(task)
    if(task !== ""){
        const list_item = document.createElement("li")
        list_item.textContent = task
        task_list.appendChild(list_item)
        const removerbutton = document.createElement("button")
        removerbutton.textContent = "remove" 
        list_item.appendChild(removerbutton)
        removerbutton.addEventListener("click", () => [
        list_item.remove()

        ])
    }
})

</script>
</body>
</HTML>
